<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f8f8f8;
        }

        h2{
            margin: 20px 0 10px;
            /* Top left/right Bottom */
        }

        .product-row{
            display: flex;
            overflow-x: auto;
            gap: 16px;
            padding: 10px 0;
            scroll-behavior: smooth;
        }

        /* Scrollbar style */
        .product-row::-webkit-scrollbar{
            height: 8px;
        }

        .product-row::-webkit-scrollbar-thumb{
            background: #ccc;
            border-radius: 10px;
        }

        .product{
            flex: 0 0 auto;
            width: 150px;
            text-align: center;
            background: white;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
        }

        .product img {
            width: 100%;
            height: 180px;
            border-radius: 6px;
        }

        .product p {
            margin: 8px 0 0;
            font-size: 14px;
        }
    </style>
</head>
