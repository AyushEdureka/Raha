<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        .container{
            display: flex;
            flex-direction: row;
            background-color: lightsalmon;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            height: 300px;
        }


       .box1{
         width: 100px;
         height: 100px;
         background-color: lightcyan;
        font-weight: bold;
        text-align: center;         
       }
    </style>
</head>
<body>
    <!-- FLEX : Display The content in 1 Dimensional Layout : Either Row or Column
         1. By Default- Row Direction 
    -->

<div class="container">
    <div class="box1">Cake</div>
    <div class="box1">Cookie</div>
    <div class="box1">Pastry</div>
</div>


</body>
</html>
