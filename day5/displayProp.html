<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p.ex1{
             color: red; 
             font-size: 24px;
             display: none;
            }

        p.ex2{
            background-color: lightblue;
            display: block;
        }    

        p.ex3{
            background-color: lightcoral;
            display: inline;
            color: lightcoral;
        }
    </style>
</head>
<body>
    <h1>Display : None</h1>
    <div>It will disable the display <p class="ex1">Hello Display None</p></div>

    <h1>Display : Block</h1>
    <div>It will Take 100 % width of screen (ex -div )<p class="ex2">Hello Display Block</p>hello how are you doing</div>

    <h1>Display : Inline</h1>
    <div>It will will Required amount of space(ex-span) <p class="ex3">Hello Display Inline</p>hello how are you doing</div>
</div>
</body>
</html>
