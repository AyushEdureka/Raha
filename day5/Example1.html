<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #89f7fe,#66a6ff);

        }

        .card{
            background: white;
            width: 300px;
            padding: 20px;
            text-align: center;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
            
        }

        .card img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin-bottom: 10px;
        }

        .skills {
            margin: 10px;
        }

        .skills span{
            background: #66a6ff;
            color: white;
            font-size: 12px;
            padding: 3px 8px;
            margin: 3px;
            border-radius: 12px;
            display: inline;
        }

        .bio{
            display: none;
        }
    </style>
</head>
<body>
    <div class="card">
    <img src="https://i.pravatar.cc/100">
    <h2>John</h2>
    <p>Web Developer</p>
    

    <div class="skills">
        <span>HTML</span>
        <span>CSS</span>
        <span>JS</span>
    </div>

    <button>Show Bio</button>
    <p class="bio" id="bio1">
        I'm a passionate web developer who loves creating fun and interactive web pages
        Always learning and experimneting
    </p>
   </div>

   
</body>
</html>
