<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            width: 100px;
            height: 100px;
            background: orange;
            margin: 10px;
            position: relative;
            left: 100px;  /* move right */
            top: 50px;   /* move down */
        }
    </style>
</head>
<body>
    <div class="box">Relative Box</div>
</body>
</html>
