<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
         .header{
               background: lightgreen;
               padding: 20px;
               position: sticky;
               top: 0;

         }
         
        
     
         .content{
            height: 1500px;
         }
    </style>
</head>
<body>
       <!-- sticky - It acts like relative(Move) at first and Then after reaching to the point 
       it will act like fixed -->

    <div class="header">Sticky Header (Scroll to see me stick)</div>
    <div class="content">Keep Scrolling....</div>
</body>
</html>
